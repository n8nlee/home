{{ define "main" }}
<main class="page-main pa4 extracurricular-page" role="main">
  <section class="blog-intro mw8 center tc mb5">
    <h2 class="f2 f1-ns lh-solid center fw4">{{ .Title | markdownify }}</h2>
    {{ with .Description }}<p class="research-intro f4 mt4 lh-copy center">{{ . | markdownify }}</p>{{ end }}
    {{ if .Params.show_author_byline }}<p class="f7 measure lh-copy tc center i">{{ if .Params.author }}Written by {{ .Params.author }}{{ end }}</p>{{ end }}
  </section>
  <section class="blog-content mw8 center">
    <article class="post-content pa0 ph4-l extracurricular-content">
      {{ .Content }}
    </article>
  </section>
</main>
{{ end }}
